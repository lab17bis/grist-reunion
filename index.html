<!DOCTYPE html>
<html lang="fr" data-fr-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Réunions</title>
  <link rel="stylesheet" href="vendor/dsfr/dsfr.min.css">
  <link rel="stylesheet" href="vendor/dsfr/utility/icons/icons.min.css">
  <link rel="stylesheet" href="commun/page.css?v=1">
  <link rel="stylesheet" href="commun/configuration.css?v=3">
  <link rel="stylesheet" href="css/app.css?v=4">
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
</head>
<body>
  <a class="fr-link rn-evitement" href="#rn-app">Aller au contenu</a>
  <div id="entete"></div>

  <div id="rn-demo" class="fr-notice fr-notice--info rn-ecran" hidden>
    <div class="rn-marge">
      <div class="fr-notice__body">
        <p class="fr-notice__title">Mode démonstration : données fictives, rien n'est enregistré.</p>
      </div>
    </div>
  </div>

  <div id="rn-coque" class="rn-marge"></div>
  <main id="rn-app" class="rn-marge" tabindex="-1" aria-live="polite">
    <p>Chargement…</p>
  </main>

  <div id="pied"></div>
  <div class="rn-pied rn-marge rn-ecran">
    <div class="rn-pied__liens">
      <a class="fr-link fr-text--sm" href="#/reglages">Réglages</a>
      <button type="button" class="fr-btn fr-btn--sm fr-btn--tertiary-no-outline fr-icon-refresh-line fr-btn--icon-left" id="rn-actualiser">Actualiser</button>
    </div>
    <div class="rn-pied__theme">
      <label class="fr-label" for="rn-theme">Thème</label>
      <select class="fr-select fr-select--sm" id="rn-theme">
        <option value="auto">Automatique</option>
        <option value="light">Clair</option>
        <option value="dark">Sombre</option>
      </select>
    </div>
  </div>

  <script src="commun/page-dsfr.js?v=2"></script>
  <script src="commun/page-editeur.js?v=1"></script>
  <script src="commun/configuration.js?v=7"></script>
  <script src="commun/grist-public.js?v=1"></script>
  <script src="js/app.js?v=5"></script>
</body>
</html>
